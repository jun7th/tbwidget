<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    overflow: hidden;
    background: transparent;
  }

  #panel {
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 4px;
    overflow: hidden;
    color: #eef2ff;
    white-space: nowrap;
    font-family: Inter, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .gpt-icon {
    width: 16px;
    height: 16px;
    display: block;
    flex: 0 0 auto;
  }

  .usage-values {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
  }

  .usage-item {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
  }

  .usage-label {
    color: #aeb8c7;
    font-size: 8px;
    font-style: normal;
    font-weight: 500;
  }

  .usage-value {
    display: inline-block;
    width: 4ch; /* 预留 100% */
    flex: 0 0 4ch;
    text-align: right;
    font-size: 10px;
    font-weight: 0;
    font-variant-numeric: tabular-nums;
  }

  #panel[data-window="both"] .usage-values {
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 1px;
  }

  #panel[data-window="both"] .usage-item {
    min-height: 10px;
  }

  #panel[data-window="primary"] .usage-weekly,
  #panel[data-window="weekly"] .usage-primary {
    display: none;
  }
</style>
