<!doctype html>
<html lang="zh-CN" theme-mode="dark" data-tb-surface="popup">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/_host/vendor/kui-vue.css">
<link rel="stylesheet" href="./common.css">
<style>
  html,
  body,
  #plugin-root {
    margin: 0;
    overflow: hidden;
    background: var(--kui-color-bg, #141414)
  }

  .popup {
    width: 340px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 14px
  }

  .usage-card {
    padding: 2px
  }

  .card-title {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 600
  }

  .usage-row {
    padding: 10px 2px;
    min-height: 48px;
    --kui-color-bg-component: #141414;
  }

  .usage-row+.usage-row {
    border-top: 1px solid var(--kui-color-border, rgba(255, 255, 255, .1))
  }

  .usage-row:first-child{
    padding-top: 0px;
  }

  .usage-row:last-child{
    padding-bottom: 0px;
  }


  .usage-top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 52px;
    align-items: center;
    gap: 12px;
  }

  .usage-heading {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 8px
  }

  .label {
    font-size: 12px
  }

  .muted {
    font-size: 12px;
    color: var(--kui-color-text-description, #999)
  }

  .usage-reset {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap
  }

  .usage-value {
    width: 52px;
    text-align: right;
    font-size: 12px;
    font-variant-numeric: tabular-nums
  }

  .list {
    display: flex;
    flex-direction: column
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 36px;
    /* padding: 7px 2px */
  }

  .row+.row {
    border-top: 1px solid var(--kui-color-border, rgba(255, 255, 255, .1))
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px
  }

  .error {
    font-size: 12px;
    color: var(--kui-color-danger, #ff7875)
  }
 
</style>
</head>
<body theme-mode="dark">
<div id="plugin-root">

<div class="popup">
  <k-card theme="fill" class="usage-card" size="small" title="用量" bordered>
      <template #extra>
         <k-space wrap style="position: absolute; right:8px; top: 8px;">
          <k-button size="small" :loading="refreshing" @click="refresh" >刷新</k-button>
          <k-button size="small" :loading="refreshing" @click="resetUsage">重置</k-button>
         </k-space >
      </template>
    <div class="usage-row">
      <div class="usage-top"><span class="usage-heading"><span class="label">5 小时限额</span><span
            class="muted usage-reset">{{ durationText(primaryResetAt) }}</span></span><strong class="usage-value">{{
          formatPercent(primaryPercent) }}</strong></div>
      <k-progress :percent="primaryPercent ?? 0" :show-info="false" size="small" color="#45d547" />
    </div>
    <div class="usage-row">
      <div class="usage-top"><span class="usage-heading"><span class="label">1 周限额</span><span
            class="muted usage-reset">{{ durationText(weeklyResetAt) }}</span></span><strong class="usage-value">{{
          formatPercent(weeklyPercent) }}</strong></div>
      <k-progress :percent="weeklyPercent ?? 0" :show-info="false" size="small" />
    </div>
  </k-card>

  <k-card theme="fill">
    <div class="list">
      <div class="row"><span class="label">显示内容</span><k-radio-group  :model-value="settings.displayMode"
          :options="displayOptions" type="button" theme="fill"  @change="value => savePopupSettings({ displayMode: value })" /></div>
      <div class="row"><span class="label">任务栏限额</span><k-radio-group :model-value="settings.windowMode"
          :options="windowOptions" type="button" theme="fill"  @change="value => savePopupSettings({ windowMode: value })" /></div>
      <div class="row"><span class="label">刷新时间</span><k-radio-group :model-value="String(settings.refreshSeconds)"
          :options="refreshOptions" type="button" theme="fill" 
          @change="value => savePopupSettings({ refreshSeconds: Number(value) })" /></div>
    </div>
  </k-card>
  <div v-if="error" class="error">{{ error }}</div>
  <div v-if="meta" class="muted">{{ meta }}</div>
</div>
</div>

<script src="/_host/vendor/vue.global.prod.js"></script>
<script src="/_host/vendor/dayjs.min.js"></script>
<script src="/_host/vendor/kui-vue.umd.js"></script>
<script src="./common.js"></script>
<script>
const api = window.GptUsage;
window.tbPlugin = {
  data() {
    return {
      settings: { ...api.defaults }, primaryPercent: null, weeklyPercent: null,
      primaryResetAt: null, weeklyResetAt: null, lastUsage: null, lastFetchedAt: null,
      meta: "", error: "", refreshing: false, timer: null, now: Date.now(),
      displayOptions: [{label:"余量",value:"remaining"},{label:"用量",value:"used"}],
      windowOptions: [{label:"5 小时",value:"primary"},{label:"1 周",value:"weekly"},{label:"两者",value:"both"}],
      refreshOptions: [{label:"1 分钟",value:"60"},{label:"5 分钟",value:"300"}],
    };
  },
  methods: {
    formatPercent: api.formatPercent,
    timeText(value) { return new Date(value).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" }); },
    durationText(resetMs) {
      if (!resetMs) return "";
      let seconds=Math.max(0,Math.ceil((resetMs-this.now)/1000)); if(seconds<=0)return "即将重置";
      const days=Math.floor(seconds/86400);seconds%=86400;const hours=Math.floor(seconds/3600);seconds%=3600;const minutes=Math.floor(seconds/60);seconds%=60;
      const parts=[];if(days)parts.push(`${days}天`);if(hours||days)parts.push(`${hours}小时`);if(minutes||hours||days)parts.push(`${minutes}分`);if(!days)parts.push(`${seconds}秒`);return `${parts.join(" ")} 后重置`;
    },
    renderUsage(usage, fetchedAt) {
      this.lastUsage=usage||null; this.lastFetchedAt=fetchedAt||null;
      this.primaryPercent=api.shownPercent(usage?.primary_remaining_percent,this.settings.displayMode);
      this.weeklyPercent=api.shownPercent(usage?.weekly_remaining_percent,this.settings.displayMode);
      this.primaryResetAt=api.normalizeResetMs(usage?.primary_reset_at); this.weeklyResetAt=api.normalizeResetMs(usage?.weekly_reset_at);
      this.meta=fetchedAt?`更新时间：${this.timeText(fetchedAt)}`:"尚未刷新";
    },
    async savePopupSettings(patch) {
      this.settings=api.normalizeSettings({...this.settings,...patch});
      await host.storage.set("settings",this.settings);
      if(this.lastUsage)this.renderUsage(this.lastUsage,this.lastFetchedAt);
    },
    resetUsage() { this.meta="重置用量属于插件业务，当前插件尚未实现。"; },
    async refresh() {
      this.refreshing=true; this.error="";
      try {
        this.settings=api.normalizeSettings({...this.settings,...await host.storage.get("settings",{})});
        const usage=await api.fetchUsage(this.settings); const fetchedAt=Date.now();
        await host.storage.set("usageCache", { usage, fetchedAt, configKey:`${this.settings.authPath}\n${this.settings.proxyUrl}` });
        this.renderUsage(usage,fetchedAt);
      } catch(error) { this.error=String(error); }
      finally { this.refreshing=false; }
    },
  },
  async mounted() {
    this.settings=api.normalizeSettings(await host.storage.get("settings",{}));
    const cached=await host.storage.get("usageCache",null);
    if(cached?.usage)this.renderUsage(cached.usage,Number(cached.fetchedAt)||null);
    const configKey=`${this.settings.authPath}\n${this.settings.proxyUrl}`;
    const cacheFresh=Boolean(cached?.usage)&&String(cached?.configKey||"")===configKey&&Date.now()-(Number(cached?.fetchedAt)||0)<this.settings.refreshSeconds*1000;
    if(!cacheFresh){this.meta=this.lastUsage?this.meta:"正在刷新…";await this.refresh();}
    this.timer=setInterval(() => { this.now=Date.now(); },1000);
  },
  beforeUnmount() { if(this.timer)clearInterval(this.timer); },
};
</script>
<script src="/_host/plugin-vue-runtime.js"></script>

</body>
</html>
